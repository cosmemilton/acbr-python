# Publicacao manual: requer tag da versao, CI completa e Trusted Publishing.
name: Publicar no PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'cosmemilton/acbr-python' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Conferir versao, tag e CI da revisao exata
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import ast, json, os, re, tomllib, urllib.request
          from pathlib import Path
          config = tomllib.loads(Path('pyproject.toml').read_text('utf-8'))['project']
          version = config['version']
          assert config['name'] == 'acbr-python'
          # Final alpha only: no dev, beta, rc, post, local or noncanonical spelling.
          number = r'(?:0|[1-9][0-9]*)'
          assert (type(version) is str
                  and re.fullmatch(number + r'\.' + number + r'\.' + number + 'a' + number, version)), 'Versao alpha final canonica obrigatoria'
          # Read the version literal without importing or executing package code.
          nodes = ast.parse(Path('src/acbr/_version.py').read_text('utf-8')).body
          if (nodes and isinstance(nodes[0], ast.Expr) and isinstance(nodes[0].value, ast.Constant)
                  and type(nodes[0].value.value) is str):
              nodes = nodes[1:]
          assert (len(nodes) == 1 and isinstance(nodes[0], ast.Assign) and len(nodes[0].targets) == 1
                  and isinstance(nodes[0].targets[0], ast.Name) and nodes[0].targets[0].id == '__version__'
                  and isinstance(nodes[0].value, ast.Constant) and type(nodes[0].value.value) is str
                  and nodes[0].value.value == version), 'Versao do modulo Python diverge do pyproject'
          notice = Path('NOTICE').read_text('utf-8').splitlines()
          assert notice and notice[0] == 'ACBr Python ' + version, 'Versao do NOTICE diverge do pyproject'
          # A candidate marker is not a claim that this version is already on PyPI.
          marker = 'Versão alpha ' + version
          assert Path('README.md').read_text('utf-8').splitlines().count(marker) == 1, 'Marcador exato de release no README ausente ou ambiguo'
          assert os.environ['GITHUB_REF'] == 'refs/tags/v' + version
          repository = os.environ['GITHUB_REPOSITORY']
          assert repository == 'cosmemilton/acbr-python'
          api = 'https://api.github.com/repos/' + repository
          url = (api
                 + '/actions/workflows/ci.yml/runs?head_sha=' + os.environ['GITHUB_SHA']
                 + '&per_page=100')
          def fetch_json(url):
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          runs = fetch_json(url)['workflow_runs']
          expected_jobs = {f'Offline {platform} / Python {python}'
                           for platform in ('ubuntu-24.04', 'windows-latest')
                           for python in ('3.11', '3.12', '3.13', '3.14')}
          expected_jobs |= {f'Runtime offline {platform}' for platform in ('ubuntu-24.04', 'windows-latest')}
          eligible = [run for run in runs if run['head_sha'] == os.environ['GITHUB_SHA']
                      and run['head_repository']['full_name'] == repository
                      and ((run['event'] == 'push' and run['head_branch'] == 'main')
                           or run['event'] == 'workflow_dispatch')]
          assert eligible, 'CI da revisao exata em main/manual pendente'
          # Nao aceitar sucesso antigo quando um run/attempt mais recente falhou ou esta em curso.
          latest = max(eligible, key=lambda run: (run['run_number'], run['run_attempt']))
          assert latest['status'] == 'completed' and latest['conclusion'] == 'success', 'CI mais recente nao aprovada'
          jobs = fetch_json(api + '/actions/runs/' + str(latest['id']) + '/jobs?filter=latest&per_page=100')['jobs']
          assert (len(jobs) == len(expected_jobs) and {job['name'] for job in jobs} == expected_jobs
                  and all(job['status'] == 'completed' and job['conclusion'] == 'success' for job in jobs)), 'CI com os 10 jobs aprovados pendente'
      - name: Testar e construir em pasta nova
        run: |
          python -m pip install build twine "setuptools>=77.0.3" -e .
          python tools/generate_models.py --check
          python -m unittest discover -s tests -v
          python -m build --outdir dist-release
          python -m twine check --strict dist-release/*
      - name: Conferir apenas wheel e sdist desta versao
        shell: python
        run: |
          import tarfile, tomllib, zipfile
          from email.parser import BytesParser
          from pathlib import Path
          def forbidden(name):
              name = name.lower()
              return name.endswith(('.exe', '.dll', '.so', '.pyd', '.dylib', '.pfx', '.p12', '.pem', '.key', '.tgz')) or '.so.' in Path(name).name
          version = tomllib.loads(Path('pyproject.toml').read_text('utf-8'))['project']['version']
          expected = {f'acbr_python-{version}-py3-none-any.whl', f'acbr_python-{version}.tar.gz'}
          assert {p.name for p in Path('dist-release').iterdir()} == expected
          with zipfile.ZipFile(Path('dist-release') / f'acbr_python-{version}-py3-none-any.whl') as wheel:
              metadata = BytesParser().parsebytes(wheel.read(f'acbr_python-{version}.dist-info/METADATA'))
              assert metadata['Name'] == 'acbr-python' and metadata['Version'] == version
              assert metadata['License-Expression'] == 'LGPL-2.1-or-later'
              assert not metadata.get_all('Requires-Dist')
              assert not any(forbidden(name) for name in wheel.namelist())
          with tarfile.open(Path('dist-release') / f'acbr_python-{version}.tar.gz') as source:
              assert not any(forbidden(member.name) for member in source)
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/acbr-python/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist-release/
      - name: Publicar artefatos verificados por Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-release/
